<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist | Picker Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>❤️ Wishlist</h1>
<a href="index.html">⬅️ হোমে ফিরে যান</a>
</header>

<section style="max-width:900px;margin:auto;padding:20px;">
<div id="wishlistItems"></div>
</section>

<script>
let items=JSON.parse(localStorage.getItem("wishlist"))||[];

let html="";

items.forEach(item=>{

html+=`
<div style="background:#fff;padding:15px;margin:10px 0;border-radius:10px;">
❤️ ${item}
</div>
`;

});

document.getElementById("wishlistItems").innerHTML=html;
</script>

</body>
</html>
