<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Picker Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>👤 আমার প্রোফাইল</h1>

<p>Picker Shop User Dashboard</p>

</header>

<section class="profile-box">

<img src="images/user.png"
id="profileImage"
class="profile-image"
alt="Profile">

<h2 id="profileName">Loading...</h2>

<p id="profileEmail"></p>
<hr>

<h3>✏️ প্রোফাইল সম্পাদনা</h3>

<input
type="text"
id="editName"
placeholder="নতুন নাম">

<input
type="email"
id="editEmail"
placeholder="নতুন ইমেইল">

<input
type="password"
id="newPassword"
placeholder="নতুন পাসওয়ার্ড">

<button
class="cart-btn"
onclick="updateProfile()">

💾 Save Changes

</button>
<hr>

<a href="cart.html" class="btn">
🛒 My Cart
</a>

<a href="wishlist.html" class="btn">
❤️ Wishlist
</a>

<a href="tracking.html" class="btn">
📦 Track Order
</a>

<a href="#" class="btn"
onclick="logoutUser()">
🚪 Logout
</a>

</section>

<script src="script.js"></script>

</body>

</html>
