<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Product Management | Picker Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-layout">

<!-- Sidebar -->

<aside class="admin-sidebar">

<h2 style="text-align:center;color:#198754;">

🌿 Picker Shop

</h2>

<hr>

<a href="admin-dashboard.html">

📊 Dashboard

</a>

<a href="admin-products.html"
class="active">

📦 Products

</a>

<a href="admin-orders.html">

🛒 Orders

</a>

<a href="admin-users.html">

👥 Users

</a>

<a href="admin-settings.html">

⚙️ Settings

</a>

<hr>

<button
class="btn"
style="width:100%;"
onclick="adminLogout()">

🚪 Logout

</button>

</aside>

<!-- Main -->

<main class="admin-main">

<h1>

📦 Product Management

</h1>

<br>

<input
type="text"
id="searchProduct"
placeholder="🔍 Product Search..."
onkeyup="searchProducts()">

<br><br>

<div class="card">

<h2>

➕ নতুন Product যোগ করুন

</h2>

<br>
<!-- Image Upload -->

<label>📷 Product Image</label>

<br><br>

<input
type="file"
id="productFile"
accept="image/*">

<br><br>

<img
id="previewImage"
src=""
style="
width:150px;
display:none;
border-radius:10px;
border:1px solid #ddd;
padding:5px;
">

<br><br>

<button
class="btn"
onclick="uploadImage()">

📤 Upload Image

</button>

<input
type="hidden"
id="productImage">

<hr>

<br>

<input
type="text"
id="productName"
placeholder="Product Name">

<br><br>

<input
type="number"
id="productPrice"
placeholder="Price">

<br><br>

<input
type="text"
id="productCategory"
placeholder="Category">

<br><br>

<textarea
id="productDescription"
rows="5"
placeholder="Product Description"></textarea>

<br><br>

<div
style="
display:flex;
gap:10px;
flex-wrap:wrap;
">

<button
class="btn"
onclick="addProduct()">

➕ Add Product

</button>

<button
class="btn"
onclick="updateProduct()">

✏️ Update Product

</button>

<button
class="btn"
onclick="resetProductForm()">

🔄 Reset

</button>

</div>

</div>

<br>

<div class="card">

<h2>

📋 Product List

</h2>

<br>
<table
style="width:100%;border-collapse:collapse;">

<thead>

<tr>

<th>Image</th>

<th>Name</th>

<th>Price</th>

<th>Category</th>

<th>Action</th>

</tr>

</thead>

<tbody id="productTable">

<tr>

<td colspan="5"
style="text-align:center;">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</main>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin:15px 0;">

<select id="categoryFilter" onchange="filterProducts()">

<option value="">সব Category</option>

</select>

<button class="btn" onclick="loadProducts()">
🔄 Refresh
</button>

<button class="btn" onclick="exportProducts()">
📤 Export CSV
</button>

</div>
<input
type="file"
id="csvFile"
accept=".csv">

<button
class="btn"
onclick="importProducts()">

📥 Import CSV

</button>

<button
class="btn"
style="background:#dc3545;"
onclick="deleteAllProducts()">

🗑 Delete All

</button>

<br><br>
