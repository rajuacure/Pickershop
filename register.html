<img src="images/logo.png" alt="Picker Shop">

<span>Picker Shop</span>

<nav class="navbar">

<!-- Register -->

<section class="products-section">

<div class="container">

<div class="card" style="max-width:550px;margin:auto;padding:35px;">

<h2 style="text-align:center;margin-bottom:25px;">

📝 নতুন অ্যাকাউন্ট তৈরি করুন

</h2>

<input
type="text"
id="registerName"
placeholder="আপনার পূর্ণ নাম">

<br><br>

<input
type="email"
id="registerEmail"
placeholder="আপনার ইমেইল">

<br><br>

<input
type="password"
id="registerPassword"
placeholder="পাসওয়ার্ড">

<br><br>

<input
type="password"
id="confirmPassword"
placeholder="পাসওয়ার্ড নিশ্চিত করুন">

<br><br>

<button
class="btn"
style="width:100%;"
onclick="registerUser()">

📝 রেজিস্টার করুন

</button>

<br><br>

<p style="text-align:center;">

আগেই অ্যাকাউন্ট আছে?

<a href="login.html">

লগইন করুন

</a>

</p>

</div>

</div>
