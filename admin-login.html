<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Picker Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="products-section">

<div class="container">

<div class="card"
style="max-width:450px;margin:auto;margin-top:80px;padding:40px;">

<h2 style="text-align:center;color:#198754;">
🔐 Admin Login
</h2>

<br>

<input
type="email"
id="adminEmail"
placeholder="Admin Email"
autocomplete="email">

<br><br>

<input
type="password"
id="adminPassword"
placeholder="Password"
autocomplete="current-password">

<br><br>

<button
type="button"
class="btn"
style="width:100%;"
onclick="adminLogin()">

Login

</button>

<br><br>

<p style="text-align:center;">
Picker Shop Admin Panel
</p>

</div>

</div>

</section>

<script type="module" src="./admin.js"></script>

</body>
</html>
