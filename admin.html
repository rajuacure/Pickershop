<body>


<h1>Admin Dashboard</h1>
<section class="product-section">

<h2>Add New Product</h2>

<input type="text" id="productName" placeholder="Product Name">

<input type="number" id="productPrice" placeholder="Product Price">

<input type="text" id="productCategory" placeholder="Category">

<input type="text" id="productImage" placeholder="Image URL">

<textarea id="productDescription" placeholder="Product Description"></textarea>

<button onclick="addProduct()">Add Product</button>


<h2>Product List</h2>

<div id="productList"></div>

</section>

<!-- Search Order -->

id="orderSearch"

placeholder="Search Order by Name, Phone, ID">
<input

<div class="dashboard">


<div class="card">
<h3>Total Orders</h3>
<p id="totalOrders">0</p>
</div>


<div class="card">
<h3>Pending</h3>
<p id="pendingOrders">0</p>
</div>


<div class="card">

</div>


<div class="card">

</div>

</div>
